<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizz.yeyo Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ===== OVERLAY HITAM (SELAMAT DATANG) ===== */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            opacity: 1;
            visibility: visible;
        }

        .welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-content {
            text-align: center;
            color: #fff;
            padding: 24px;
            animation: fadeUp 1s ease;
        }

        .welcome-content h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f5a623, #f7c948);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-content p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        .welcome-content .loader {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f5a623;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== BACKGROUND VIDEO ===== */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Overlay transparan tipis agar teks tetap terbaca */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* ===== CARD PROFIL (TANPA KOTAK BACKGROUND) ===== */
        .container {
            max-width: 400px;
            width: 100%;
            padding: 32px 24px 28px;
            border-radius: 32px;
            text-align: center;
            position: relative;
            z-index: 2;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
        }

        /* ===== AVATAR DENGAN BINGKAI BIRU TIPIS BERPUTAR ===== */
        .avatar-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 14px;
        }

        /* Lingkaran berputar (bingkai biru tipis) */
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #1d9bf0,
                #00d4ff,
                #1d9bf0,
                #00d4ff,
                #1d9bf0
            );
            animation: spinBorder 3s linear infinite;
            z-index: 0;
            opacity: 0.7;
        }

        /* Efek glow biru tipis di belakang */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(29, 155, 240, 0.15), transparent 70%);
            filter: blur(10px);
            z-index: -1;
            animation: glowPulse 2.5s ease-in-out infinite;
        }

        @keyframes spinBorder {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .avatar-link {
            display: block;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            text-decoration: none;
            transition: transform 0.3s ease;
            overflow: hidden;
            position: relative;
            z-index: 1;
            margin: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }

        .avatar-link:hover {
            transform: scale(1.08);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Nama dengan efek glow */
        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1d9bf0;
            color: #fff;
            font-size: 14px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(29, 155, 240, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }

        .verified-badge i {
            font-size: 11px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(29, 155, 240, 0.5); }
            50% { box-shadow: 0 0 25px rgba(29, 155, 240, 0.8), 0 0 50px rgba(29, 155, 240, 0.2); }
            100% { box-shadow: 0 0 15px rgba(29, 155, 240, 0.5); }
        }

        /* Badge dengan latar transparan */
        .badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 4px 0 10px;
            letter-spacing: 0.2px;
        }

        /* ===== TYPING EFFECT ===== */
        .bio-wrapper {
            font-size: 14px;
            color: #fff;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 0 4px;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
        }

        #typing-text {
            display: inline;
            border-right: 2px solid #1d9bf0;
            padding-right: 4px;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { border-color: #1d9bf0; }
            50% { border-color: transparent; }
        }

        /* Tombol Donasi dengan latar transparan */
        .donate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
            margin-bottom: 28px;
            width: 100%;
            max-width: 220px;
        }

        .donate-btn i {
            font-size: 16px;
            color: #f5a623;
        }

        .donate-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Grid Sosial dengan latar transparan */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .social-item {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 14px 4px;
            border-radius: 18px;
            color: #eee;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.15s;
        }

        .social-item i {
            font-size: 22px;
            color: #fff;
        }

        .social-item span {
            font-size: 10px;
            opacity: 0.8;
            letter-spacing: 0.2px;
        }

        .social-item:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .social-item:hover i {
            color: #fff;
        }

        /* Footer */
        .footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
            letter-spacing: 0.2px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* ===== INDICATOR SUARA ===== */
        .sound-indicator {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            user-select: none;
        }

        .sound-indicator .sound-icon {
            color: #4fc3f7;
            font-size: 18px;
            animation: soundPulse 1.5s ease-in-out infinite;
        }

        @keyframes soundPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .sound-indicator .sound-label {
            color: #aaa;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Responsif */
        @media (max-width: 420px) {
            .container {
                padding: 24px 16px 20px;
                border-radius: 24px;
            }
            .avatar-wrapper {
                width: 80px;
                height: 80px;
            }
            .avatar-link {
                width: 72px;
                height: 72px;
            }
            .name {
                font-size: 22px;
            }
            .verified-badge {
                width: 18px;
                height: 18px;
                font-size: 11px;
            }
            .verified-badge i {
                font-size: 9px;
            }
            .social-item {
                padding: 12px 2px;
                border-radius: 14px;
            }
            .social-item i {
                font-size: 18px;
            }
            .donate-btn {
                padding: 10px 20px;
                font-size: 13px;
                max-width: 180px;
            }
            .bio-wrapper {
                font-size: 13px;
                min-height: 20px;
            }
            .welcome-content h1 {
                font-size: 1.8rem;
            }
            .welcome-content p {
                font-size: 0.95rem;
            }
            .sound-indicator {
                bottom: 16px;
                right: 16px;
                padding: 8px 14px;
                gap: 8px;
            }
            .sound-indicator .sound-label {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .social-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

    <script>
        // ---- Typing Effect ----

        let index = 0;
        let isDeleting = false;

        function typeEffect() {
            if (!isDeleting) {
                if (index < text.length) {
                    typingElement.textContent = text.substring(0, index + 1);
                    index++;
                    setTimeout(typeEffect, 50);
                } else {
                    isDeleting = true;
                    setTimeout(typeEffect, 3000);
                }
            } else {
                if (index > 0) {
                    typingElement.textContent = text.substring(0, index - 1);
                    index--;
                    setTimeout(typeEffect, 30);
                } else {
                    isDeleting = false;
                    setTimeout(typeEffect, 500);
                }
            }
        }

        // ---- Overlay Hitam (Selamat Datang) ----
        const overlay = document.getElementById('welcomeOverlay');

        // Sembunyikan overlay setelah 3 detik
        setTimeout(() => {
            overlay.classList.add('hidden');
        }, 3000);

        // Mulai efek typing setelah overlay hilang (3,5 detik)
        setTimeout(() => {
            typeEffect();
        }, 3500);

        // Backup: jika efek typing belum jalan, jalankan setelah 5 detik
        setTimeout(() => {
            if (typingElement.textContent === '') {
                typeEffect();
            }
        }, 5000);
