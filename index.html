<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizz.yeyo Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .container {
            background: #141414;
            max-width: 400px;
            width: 100%;
            padding: 32px 24px 28px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(20, 20, 20, 0.85);
        }

        /* Avatar */
        .avatar-link {
            display: block;
            width: 88px;
            height: 88px;
            margin: 0 auto 14px;
            border-radius: 50%;
            text-decoration: none;
            transition: transform 0.2s;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .avatar-link:hover {
            transform: scale(1.05);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Nama */
        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1d9bf0;
            color: #fff;
            font-size: 14px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(29, 155, 240, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }

        .verified-badge i {
            font-size: 11px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px rgba(29, 155, 240, 0.5);
            }
            50% {
                box-shadow: 0 0 25px rgba(29, 155, 240, 0.8), 0 0 50px rgba(29, 155, 240, 0.2);
            }
            100% {
                box-shadow: 0 0 15px rgba(29, 155, 240, 0.5);
            }
        }

        /* Badge */
        .badge {
            display: inline-block;
            background: rgba(31, 31, 31, 0.8);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin: 4px 0 10px;
            letter-spacing: 0.2px;
        }

        /* ===== TYPING EFFECT ===== */
        .bio-wrapper {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 24px;
            line-height: 1.5;
            padding: 0 4px;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #typing-text {
            display: inline;
            border-right: 2px solid #1d9bf0;
            padding-right: 4px;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% {
                border-color: #1d9bf0;
            }
            50% {
                border-color: transparent;
            }
        }

        /* Tombol Donasi */
        .donate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(30, 30, 30, 0.8);
            color: #eee;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
            margin-bottom: 28px;
            width: 100%;
            max-width: 220px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .donate-btn i {
            font-size: 16px;
            color: #f5a623;
        }

        .donate-btn:hover {
            background: rgba(38, 38, 38, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Grid Sosial */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .social-item {
            background: rgba(26, 26, 26, 0.8);
            padding: 14px 4px;
            border-radius: 18px;
            color: #bbb;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.15s;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .social-item i {
            font-size: 22px;
            color: #ccc;
        }

        .social-item span {
            font-size: 10px;
            opacity: 0.7;
            letter-spacing: 0.2px;
        }

        .social-item:hover {
            background: rgba(34, 34, 34, 0.9);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
        }

        .social-item:hover i {
            color: #fff;
        }

        /* Footer */
        .footer {
            font-size: 12px;
            color: #777;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
            letter-spacing: 0.2px;
        }

        .footer a {
            color: #999;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            color: #bbb;
            text-decoration: underline;
        }

        /* Responsif */
        @media (max-width: 420px) {
            .container {
                padding: 24px 16px 20px;
                border-radius: 24px;
            }
            .avatar-link {
                width: 72px;
                height: 72px;
            }
            .name {
                font-size: 22px;
            }
            .verified-badge {
                width: 18px;
                height: 18px;
                font-size: 11px;
            }
            .verified-badge i {
                font-size: 9px;
            }
            .social-item {
                padding: 12px 2px;
                border-radius: 14px;
            }
            .social-item i {
                font-size: 18px;
            }
            .donate-btn {
                padding: 10px 20px;
                font-size: 13px;
                max-width: 180px;
            }
            .bio-wrapper {
                font-size: 13px;
                min-height: 20px;
            }
        }

        @media (max-width: 360px) {
            .social-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-image" style="background-image: url('https://raw.githubusercontent.com/Kyyjeje/Foto-thumb/main/risky.jpg');"></div>
    <div class="overlay"></div>

    <div class="container">

        <!-- Avatar -->
        <a href="#" class="avatar-link" target="_blank">
            <img src="https://raw.githubusercontent.com/Kyyjeje/Foto-thumb/main/risky.jpg" alt="Rizz.yeyo" class="avatar" />
        </a>

        <!-- Nama -->
        <div class="name-wrapper">
            <span class="name">RISKY DWI NUGROHO</span>
            <span class="verified-badge">
                <i class="fas fa-check"></i>
            </span>
        </div>

        <!-- Badge -->
        <div class="badge">IT Engineering | Developer Website</div>

        <!-- Bio dengan Typing Effect -->
        <div class="bio-wrapper">
            <span id="typing-text"></span>
        </div>

        <!-- Tombol Donasi -->
        <a href="https://saweria.co/" class="donate-btn" target="_blank">
            <i class="fas fa-mug-hot"></i> Saweria / Donasi
        </a>

        <!-- Grid Sosial Media -->
        <div class="social-grid">

            <a href="https://github.com" class="social-item" target="_blank">
                <i class="fab fa-github"></i>
                <span>Github</span>
            </a>

            <a href="https://facebook.com" class="social-item" target="_blank">
                <i class="fab fa-facebook"></i>
                <span>Facebook</span>
            </a>

            <a href="https://youtube.com" class="social-item" target="_blank">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <a href="https://wa.me/6283119846840" class="social-item" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <a href="https://whatsapp.com/channel/" class="social-item" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp Channel</span>
            </a>

            <a href="https://instagram.com/rizz.yeyo" class="social-item" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

        </div>

        <!-- Footer -->
        <div class="footer">
            made with <a href="https://github.com" target="_blank">@Riskybisnis@safari.com</a>
        </div>

    </div>

    <!-- ===== JAVASCRIPT TYPING EFFECT ===== -->
    <script>
        const text = "Developer Website IT engineering - 26 Januari 2005/Teknik Kendaraan Ringan Otomotif/-SMKN 1 GERIH";
        const typingElement = document.getElementById('typing-text');
        let index = 0;
        let isDeleting = false;

        function typeEffect() {
            if (!isDeleting) {
                // Mengetik
                if (index < text.length) {
                    typingElement.textContent = text.substring(0, index + 1);
                    index++;
                    setTimeout(typeEffect, 50); // Kecepatan mengetik
                } else {
                    // Selesai mengetik, tunggu sebentar lalu hapus
                    isDeleting = true;
                    setTimeout(typeEffect, 3000); // Tunggu 3 detik sebelum menghapus
                }
            } else {
                // Menghapus
                if (index > 0) {
                    typingElement.textContent = text.substring(0, index - 1);
                    index--;
                    setTimeout(typeEffect, 30); // Kecepatan menghapus
                } else {
                    // Selesai menghapus, mulai mengetik lagi
                    isDeleting = false;
                    setTimeout(typeEffect, 500);
                }
            }
        }

        // Mulai efek setelah halaman dimuat
        window.onload = function() {
            setTimeout(typeEffect, 1000); // Tunggu 1 detik sebelum mulai
        };
    </script>

</body>
</html>
